<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Plan Form</title>
    <link rel="stylesheet" href="dietPlanStyle.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="wrapper">
        <form action="submitDietPlan.html">
            <h1>Assign Diet Plan</h1>
            <div class="input-box">
                <input type="text" placeholder="Patient ID" required>
                <i class='bx bx-id-card'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Healthcare Center ID" required>
                <i class='bx bxs-building-house'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Dietitian Employee ID" required>
                <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Overall Goals" required>
                <i class='bx bx-target'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Dietary Restrictions" required>
                <i class='bx bx-food-menu'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Nutrition Target" required>
                <i class='bx bx-target-lock'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Meal Frequency" required>
                <i class='bx bx-time'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Food Group" required>
                <i class='bx bx-food'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Recommendation" required>
                <i class='bx bx-message'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Sample Meal" required>
                <i class='bx bx-cake'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Plans" required>
                <i class='bx bx-calendar'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Portion Size" required>
                <i class='bx bx-portion'></i>
            </div>
            <button type="submit" class="btn">Submit Diet Plan</button>
        </form>
    </div>
</body>

</html>
