<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Demographic Report</title>
    <link rel="stylesheet" href="seeDemodataStyle.css">
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <h1>Patient Demographic Report</h1>
        </header>

        <div class="report-container">
            <h2>Patient Details</h2>
            <table class="report-table">
                <tr>
                    <th>Patient ID:</th>
                    <td id="report_patient_id"></td>
                </tr>
                <tr>
                    <th>Patient Name:</th>
                    <td id="report_patient_name"></td>
                </tr>
                <tr>
                    <th>Blood Pressure (mmHg):</th>
                    <td id="report_blood_pressure"></td>
                </tr>
                <tr>
                    <th>Heart Rate (bpm):</th>
                    <td id="report_heart_rate"></td>
                </tr>
                <tr>
                    <th>Temperature (°C):</th>
                    <td id="report_temperature"></td>
                </tr>
                <tr>
                    <th>Respiratory Rate (breaths/min):</th>
                    <td id="report_respiratory_rate"></td>
                </tr>
                <tr>
                    <th>Blood Type:</th>
                    <td id="report_blood_type"></td>
                </tr>
                <tr>
                    <th>Rh Factor:</th>
                    <td id="report_rh_factor"></td>
                </tr>
                <tr>
                    <th>Allergies:</th>
                    <td id="report_allergies"></td>
                </tr>
                <tr>
                    <th>Immunization:</th>
                    <td id="report_immunization"></td>
                </tr>
                <tr>
                    <th>Family History:</th>
                    <td id="report_family_history"></td>
                </tr>
                <tr>
                    <th>Addiction:</th>
                    <td id="report_addiction"></td>
                </tr>
            </table>
        </div>

        <footer class="footer">
            <p>© 2024 Medical Records. All rights reserved.</p>
        </footer>
    </div>

    <script src="patientReportScript.js"></script>
</body>

</html>
