<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring ID Form</title>
    <link rel="stylesheet" href="monitoringIDStyle.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="wrapper">
        <form action="submitMonitoringID.html">
            <h1>Monitoring ID Form</h1>
            <div class="input-box">
                <input type="text" placeholder="Monitoring Account ID" required>
                <i class='bx bx-id-card'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="First Name" required>
                <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Middle Name">
                <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Last Name" required>
                <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Blood Glucose Level Over a Week" required>
                <i class='bx bx-calendar'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Insulin Delivery Schedule" required>
                <i class='bx bx-calendar'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Carbohydrate Intake" required>
                <i class='bx bx-food-menu'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Activity Level" required>
                <i class='bx bx-run'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Diabetes Type" required>
                <i class='bx bx-plus'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Recommended Health Care Center" required>
                <i class='bx bxs-building-house'></i>
            </div>
            <div class="input-box">
                <input type="date" placeholder="Attended Date" required>
                <i class='bx bx-calendar'></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Recommended Personalized Diet Plan" required>
                <i class='bx bx-message'></i>
            </div>
            <div class="sync-date">
                <p>Last Sync Date: <span id="last-sync-date"></span></p>
            </div>
            <button type="submit" class="btn">Submit Monitoring Info</button>
        </form>
    </div>

    <script>
        // JavaScript to set the last sync date to today's date
        document.getElementById('last-sync-date').textContent = new Date().toLocaleDateString();
    </script>
</body>

</html>
