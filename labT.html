<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="addPhysicianStyle.css">
    <title>Healthcare Staff Details</title>
</head>

<body>
    <div class="container">
        <div class="wrapper">
            <form id="doctor-form">
                <h1>Lab Technician's Information</h1>
                <!-- Common Fields -->
                <div class="input-box"><input type="text" placeholder="Employee ID" required></div>
                <div class="input-box"><input type="text" placeholder="First Name" required></div>
                <div class="input-box"><input type="text" placeholder="Middle Name"></div>
                <div class="input-box"><input type="text" placeholder="Last Name" required></div>
                <div class="input-box">
                    <select required>
                        <option value="" disabled selected>Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="input-box"><input type="date" placeholder="Hiring Date" required></div>
                <div class="input-box"><input type="text" placeholder="House Number" required></div>
                <div class="input-box"><input type="text" placeholder="Road Number" required></div>
                <div class="input-box"><input type="text" placeholder="Area" required></div>
                <div class="input-box"><input type="text" placeholder="City" required></div>
                <div class="input-box"><input type="text" placeholder="Monitoring Account ID" required></div>
                <div class="input-box"><input type="text" placeholder="Healthcare Center ID" required></div>
                <div class="input-box"><input type="text" placeholder="Attending Center ID" required></div>
                <div class="input-box"><input type="text" placeholder="Patient ID" required></div>
                <div class="input-box"><input type="text" placeholder="Prescription ID" required></div>

                <form id="labtech-form">

                    <!-- Common Fields (similar to Doctor form) -->
                    <!-- Lab Technician-Specific Fields -->
                    <div class="input-box"><input type="text" placeholder="Sample ID" required></div>
                    <div class="input-box"><input type="date" placeholder="Sample Collection Date" required></div>
                    <div class="input-box"><input type="text" placeholder="Result" required></div>
                    <div class="input-box"><input type="date" placeholder="Result Delivery Date" required></div>
                    <button type="submit" class="btn">Submit</button>
                </form>
