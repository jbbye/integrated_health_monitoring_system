<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Diagnosis - Medicine Analytics</title>
    <link rel="stylesheet" href="recorddiagnosisStyle.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Record Diagnosis</h1>
            <nav class="nav">
                <a href="#">Dashboard</a>
                <a href="#">Patient List</a>
                <a href="#">Risk Assessment</a>
                <a href="#">Logout</a>
            </nav>
        </header>

        <div class="main-content">
            <!-- Patient Information Section -->
            <div class="patient-info">
                <h2>Patient Information</h2>
                <form id="patientForm">
                    <div class="form-group">
                        <label for="patientId">Patient ID:</label>
                        <input type="text" id="patientId" name="patientId" readonly>
                    </div>
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="middleName">Middle Name:</label>
                        <input type="text" id="middleName" name="middleName">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender:</label>
                        <input type="text" id="gender" name="gender" readonly>
                    </div>
                    <div class="form-group">
                        <h3>Address:</h3>
                        <p></p>
                        <br>
                        <!-- adds a line break between paragraphs -->
                        <p>T</p>
                        <label for="houseNo">House No:</label>
                        <input type="text" id="houseNo" name="houseNo" required>
                    </div>
                    <div class="form-group">
                        <label for="roadNo">Road No:</label>
                        <input type="text" id="roadNo" name="roadNo" required>
                    </div>
                    <div class="form-group">
                        <label for="area">Area:</label>
                        <input type="text" id="area" name="area" required>
                    </div>
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="monitoringAccountId">Monitoring Account ID:</label>
                        <input type="text" id="monitoringAccountId" name="monitoringAccountId" required>
                    </div>
                </form>
            </div>

            <!-- Diagnosis Information Section -->
            <div class="diagnosis-form">
                <h2>Diagnosis Information</h2>
                <form id="diagnosisForm">
                    <div class="form-group">
                        <label for="diagnosisDate">Date of Diagnosis:</label>
                        <input type="date" id="diagnosisDate" name="diagnosisDate" required>
                    </div>
                    <div class="form-group">
                        <label for="patientId">Patient ID:</label>
                        <input type="text" id="patientId" name="patientId" required>
                    </div>
                    <div class="form-group">
                        <label for="healthcareCenterId">Healthcare Center ID:</label>
                        <input type="text" id="healthcareCenterId" name="healthcareCenterId" required>
                    </div>
                    <div class="form-group">
                        <label for="diagnosisId">Diagnosis ID:</label>
                        <input type="text" id="diagnosisId" name="diagnosisId" required>
                    </div>
                    <div class="form-group">
                        <label for="diagnosisName">Diagnosis Name:</label>
                        <input type="text" id="diagnosisName" name="diagnosisName" required>
                    </div>
                    <div class="form-group">
                        <label for="ict10Code">ICT-10 Code:</label>
                        <input type="text" id="ict10Code" name="ict10Code" required>
                    </div>
                    <div class="form-group">
                        <label for="diagnosisDescription">Diagnosis Description:</label>
                        <textarea id="diagnosisDescription" name="diagnosisDescription" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="physicianId">Physician ID:</label>
                        <input type="text" id="physicianId" name="physicianId" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Save Diagnosis</button>
                        <button type="reset" class="btn-reset">Reset Form</button>
                        <a href="#" class="btn-back">Back to Dashboard</a>
                    </div>
                </form>
            </div>
        </div>

        <footer class="footer">
            <p>© 2024 Medicine Analytics. All rights reserved.</p>
        </footer>
    </div>
</body>

</html>
